# certbot بعداً بخش 443 را خودش به همین فایل اضافه می‌کند (deploy/https.sh).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__ _;
    server_tokens off;   # نسخهٔ nginx در هدرِ Server و صفحه‌های خطا لو نرود

    root /opt/khanesh/web;
    index index.html;

    # بدنهٔ عکس‌ها؛ کمتر از limit خودِ Express (60mb)
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # تحلیل یک برگه تا ۱۵۰ ثانیه و بیشتر
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8787;
    }

    # صفحه خطای ۴۰۴ واقعی برای جلوگیری از Soft-404
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # کارگرِ pdf.js (specs/017) یک module worker با پسوندِ .mjs است. مرورگر
    # اسکریپتِ ماژول را با MIMEِ غیرِ JavaScript اجرا نمی‌کند، و mime.typesِ
    # نسخه‌های قدیمیِ nginx پسوندِ mjs را نمی‌شناسد ⇒ application/octet-stream
    # و «ابزارِ خواندنِ PDF بارگیری نشد». مکانِ regex بر /assets/ مقدم است.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # مسیرهای داینامیک و خصوصی React (نیاز به فال‌بک SPA به /index.html)
    location ~ ^/(app|signin|profile|tafsir|landing|history|terms|privacy|pricing|payment) {
        try_files $uri $uri/ /index.html;
    }

    # صفحه‌های محتوایی (HTML آماده‌شده در build) و بازگرداندن ۴۰۴ واقعی
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
}
