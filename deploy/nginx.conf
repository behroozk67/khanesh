# certbot بعداً بخش 443 را خودش به همین فایل اضافه می‌کند (deploy/https.sh).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__ www.__DOMAIN__ _;

    root /opt/khanesh/web;
    index index.html;

    # بدنهٔ عکس‌ها؛ کمتر از limit خودِ Express (60mb)
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # تحلیل یک برگه تا ۱۵۰ ثانیه و بیشتر
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8787;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /app و بقیهٔ مسیرهای React
    location / {
        try_files $uri /index.html;
    }
}
